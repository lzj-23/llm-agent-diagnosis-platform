<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>诊断平台 · 实验回放</title>
<style>body{font:16px/1.8 system-ui,sans-serif;color:#24382f;background:#f3f5ef;margin:0}main{max-width:1040px;margin:auto;padding:40px 24px}h1{font-size:36px;line-height:1.3}section{background:white;border:1px solid #d9e0d4;border-radius:12px;padding:24px;margin:20px 0}a{color:#176b4b}button,select{font:inherit;padding:10px;border:1px solid #afbaae;border-radius:6px;background:white}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f5ef;padding:14px}details{margin:10px 0}.notice{border-left:4px solid #cb8a28;padding-left:14px}.muted{color:#607368}</style></head>
<body><style>table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:14px}th,td{text-align:left;vertical-align:top;padding:10px;border-bottom:1px solid #d9e0d4;overflow-wrap:anywhere}th:first-child{width:48%}</style><main><p class="muted">DIAG / LAB · PUBLIC REPLAY</p><h1>从故障现象到证据与复测</h1>
<p class="notice">这是保存结果的静态回放，不是实时 Agent。没有大模型请求，不需要密钥，不接受用户日志。演示数据包含合成案例和明确标注的本机实验，不能代表生产准确率。</p>
<a href="https://github.com/lzj-23/llm-agent-diagnosis-platform">查看源代码、复现步骤与完整评测</a>
<section><label for="case">选择已完成案例 </label><select id="case"></select><p id="kind"></p></section>
<section><h2>诊断报告</h2><div id="report">正在载入…</div></section>
<section><h2>执行记录</h2><div id="trace"></div></section>
<section><h2>引用证据</h2><div id="evidence"></div></section>
<section><h2>实测上下文调整结果</h2><div id="retest"></div></section>
<section><h2>Synthetic v2 冻结抽样</h2><p class="muted">开发者合成且标签公开，不是独立盲测。类别命中不等于根因正确；“需关注”表示报告未通过最终证据门禁。</p><div id="synthetic"></div></section>
<footer class="muted">只读回放 · 原始结果保留不确定性 · 不执行运维操作</footer></main><script src="app.js"></script></body></html>
