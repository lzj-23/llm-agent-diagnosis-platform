[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-agent-diagnosis-platform"
version = "0.1.0"
description = "Multi-agent diagnosis and optimization platform for LLM services."
requires-python = ">=3.10,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.5,<3",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "mcp>=1.20,<2",
  "sqlalchemy>=2,<3",
  "psycopg[binary]>=3,<4",
  "redis>=5,<7",
  "opentelemetry-sdk>=1.30,<2",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
neural = ["sentence-transformers>=3,<6"]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated.*:starlette.exceptions.StarletteDeprecationWarning",
  "ignore:The anyio.abc.BlockingPortal alias is deprecated.*:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
